services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_DATABASE=dts_database
      - DB_USERNAME=dts_user
      - DB_PASSWORD=dts_password
      - REDIS_HOST=redis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - APP_URL=http://localhost:8000
    depends_on:
      - postgres
      - redis
      - meilisearch
    networks:
      - dts-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://api-dtms.devbry.online
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - dts-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dts_database
      POSTGRES_USER: dts_user
      POSTGRES_PASSWORD: dts_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dts-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - dts-network

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: dts_master_key_2024
    ports:
      - "7700:7700"
    networks:
      - dts-network

volumes:
  pgdata:

networks:
  dts-network:
