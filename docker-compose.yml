services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dts-backend:latest
    pull_policy: never
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DTMS - Document Tracking and Management System
      - APP_ENV=production
      - APP_KEY=base64:A1KIAODRUlD5Sm1EBrevDodwnqkVa+C32SBTb0CTc3E=
      - APP_DEBUG=false
      - APP_TIMEZONE=Asia/Manila
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - LOGIN_MAX_ATTEMPTS=5
      - LOGIN_LOCKOUT_MINUTES=15
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dts_database
      - DB_USERNAME=dts_user
      - DB_PASSWORD=dts_password_2024
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - SESSION_DOMAIN=localhost
      - SANCTUM_STATEFUL_DOMAINS=localhost:3000
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=dts_meili_key_2024
      - SCOUT_DRIVER=meilisearch
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=dts-app
      - REVERB_APP_KEY=dts-reverb-key
      - REVERB_APP_SECRET=dts-reverb-secret
      - REVERB_HOST=127.0.0.1
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=noreply@dts.gov.ph
      - SEMAPHORE_SENDER_NAME=DTS
      - SEMAPHORE_API_KEY=
      - QRCODE_SIZE=300
      - LOG_LEVEL=warning
      - BCRYPT_ROUNDS=12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped
    volumes:
      - backend-storage:/var/www/html/storage/app/public
      - mailbox-storage:/var/www/html/storage/app/private

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: dts-frontend:latest
    pull_policy: never
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dts_database
      POSTGRES_USER: dts_user
      POSTGRES_PASSWORD: dts_password_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dts_user -d dts_database" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: dts_meili_key_2024
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  meilidata:
  backend-storage:
  mailbox-storage:
