services:
  backend:
    build:
      context: https://github.com/dblademasteh/dtms-revamp.git#master
      dockerfile: backend/Dockerfile
    image: dts-backend:latest
    platform: linux/arm64
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DTS - Document Tracking System
      - APP_ENV=production
      - APP_KEY=base64:A1KIAODRUlD5Sm1EBrevDodwnqkVa+C32SBTb0CTc3E=
      - APP_DEBUG=false
      - APP_TIMEZONE=Asia/Manila
      - APP_URL=https://api-dtms.devbry.online
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=dts_database
      - DB_USERNAME=dts_user
      - DB_PASSWORD=dts_password_2024
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - SESSION_DOMAIN=dtms.devbry.online
      - SANCTUM_STATEFUL_DOMAINS=dtms.devbry.online
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - REDIS_PORT=6379
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=dts_meili_key_2024
      - SCOUT_DRIVER=meilisearch
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=noreply@dts.gov.ph
      - SEMAPHORE_SENDER_NAME=DTS
      - QRCODE_SIZE=300
      - LOG_LEVEL=warning
      - BCRYPT_ROUNDS=12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend-storage:/var/www/html/storage/app/public
    labels:
      - traefik.enable=true
      - traefik.http.routers.dts-backend.rule=Host(`api-dtms.devbry.online`)
      - traefik.http.routers.dts-backend.entrypoints=https
      - traefik.http.routers.dts-backend.tls=true
      - traefik.http.routers.dts-backend.tls.certresolver=letsencrypt
      - traefik.http.services.dts-backend.loadbalancer.server.port=8000

  frontend:
    build:
      context: https://github.com/dblademasteh/dtms-revamp.git#master
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://api-dtms.devbry.online
        VITE_APP_NAME: DTS
    image: dts-frontend:latest
    platform: linux/arm64
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.dts-frontend.rule=Host(`dtms.devbry.online`)
      - traefik.http.routers.dts-frontend.entrypoints=https
      - traefik.http.routers.dts-frontend.tls=true
      - traefik.http.routers.dts-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.dts-frontend.loadbalancer.server.port=80

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    environment:
      POSTGRES_DB: dts_database
      POSTGRES_USER: dts_user
      POSTGRES_PASSWORD: dts_password_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dts_user -d dts_database"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    platform: linux/arm64
    environment:
      MEILI_MASTER_KEY: dts_meili_key_2024
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  meilidata:
  backend-storage:
