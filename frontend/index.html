<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="description" content="Track, route, and account for government documents" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-256x256.png" />
    <title>DTMS - Document Tracking and Management System</title>
    <script>
      // Use the uploaded branding logo as the browser tab icon when available.
      (function () {
        function setFavicon(url) {
          if (!url) return
          document.querySelectorAll('link[rel="icon"]').forEach(function (l) {
            l.href = url
          })
        }
        fetch('/api/branding')
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (d) {
            var b = d && d.branding
            if (!b) return
            setFavicon(b.sidebar_logo || b.login_logo || '/favicon-32x32.png')
          })
          .catch(function () {})
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Fira+Code:wght@400;500&family=Manrope:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Lora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
