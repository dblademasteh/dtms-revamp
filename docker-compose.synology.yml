services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dts-backend:latest
    pull_policy: never
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-DTS - Document Tracking System}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_TIMEZONE=Asia/Manila
      - APP_URL=${APP_URL:-https://dtms.devbry.online}
      - FRONTEND_URL=${FRONTEND_URL:-https://dtms.devbry.online}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dts_database}
      - DB_USERNAME=${DB_USERNAME:-dts_user}
      - DB_PASSWORD=${DB_PASSWORD:-dts_password_2024}
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - SESSION_DOMAIN=${SESSION_DOMAIN:-}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-dtms.devbry.online}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-dts_meili_key_2024}
      - SCOUT_DRIVER=meilisearch
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-dts-app}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-dts-reverb-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-dts-reverb-secret}
      - REVERB_HOST=${REVERB_HOST:-127.0.0.1}
      - REVERB_PORT=${REVERB_PORT:-8080}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - MAIL_MAILER=${MAIL_MAILER:-log}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@dts.gov.ph}
      - SEMAPHORE_SENDER_NAME=${SEMAPHORE_SENDER_NAME:-DTS}
      - QRCODE_SIZE=300
      - LOG_LEVEL=warning
      - BCRYPT_ROUNDS=12
      - TRUSTED_PROXIES=*
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped
    env_file:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/.env
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/.env:/var/www/html/.env
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/storage:/var/www/html/storage
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-DTS}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-dts-reverb-key}
    image: dts-frontend:latest
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dts_database}
      POSTGRES_USER: ${DB_USERNAME:-dts_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dts_password_2024}
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/postgres/data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dts_user} -d ${DB_DATABASE:-dts_database}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/redis/data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-dts_meili_key_2024}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/meilisearch/data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: service:frontend
    depends_on:
      - frontend
    command: ["tunnel", "--no-autoupdate", "run", "--token=${CLOUDFLARE_TUNNEL_TOKEN}"]
