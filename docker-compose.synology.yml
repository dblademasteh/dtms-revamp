services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dts-backend:latest
    pull_policy: never
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-DTMS - Document Tracking and Management System}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_TIMEZONE=Asia/Manila
      - APP_URL=${APP_URL:-https://dtms.devbry.online}
      - FRONTEND_URL=${FRONTEND_URL:-https://dtms.devbry.online}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dts_database}
      - DB_USERNAME=${DB_USERNAME:-dts_user}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - SESSION_DOMAIN=${SESSION_DOMAIN:-}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-dtms.devbry.online}
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      - MEILISEARCH_HOST=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:?Set MEILISEARCH_KEY in .env}
      - SCOUT_DRIVER=meilisearch
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:?Set REVERB_APP_ID in .env}
      - REVERB_APP_KEY=${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env}
      - REVERB_HOST=${REVERB_HOST:-127.0.0.1}
      - REVERB_PORT=${REVERB_PORT:-8080}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:?Set MAIL_USERNAME in .env}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS in .env}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-DTMS}
      - SEMAPHORE_SENDER_NAME=${SEMAPHORE_SENDER_NAME:-DTS}
      - QRCODE_SIZE=300
      - LOG_LEVEL=warning
      - BCRYPT_ROUNDS=12
      - TRUSTED_PROXIES=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,127.0.0.1/32
      - SESSION_SECURE_COOKIE=${SESSION_SECURE_COOKIE:-true}
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_LOCKOUT_MINUTES=${LOGIN_LOCKOUT_MINUTES:-15}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped
    env_file:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/.env
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/.env:/var/www/html/.env
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/storage:/var/www/html/storage
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/backend/bootstrap/cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-DTS}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-dts-reverb-key}
    image: dts-frontend:latest
    pull_policy: never
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dts_database}
      POSTGRES_USER: ${DB_USERNAME:-dts_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/postgres/data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dts_user} -d ${DB_DATABASE:-dts_database}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "if [ -n \"${REDIS_PASSWORD:-}\" ]; then exec redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}; else exec redis-server --appendonly yes; fi"]
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/redis/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"${REDIS_PASSWORD:-}\" ]; then redis-cli -a \"${REDIS_PASSWORD:-}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${DOCKER_BASE_PATH:-/volume1/docker/dts}/meilisearch/data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
    command: ["tunnel", "--no-autoupdate", "run", "--protocol", "http2", "--token=${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
